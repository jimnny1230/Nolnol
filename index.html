<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홍서현 놀리기</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 50%, #FFE082 100%);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 20px;
  }

  .card {
    background: #FFFDF7;
    border-radius: 30px;
    padding: 50px 40px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 15px 40px rgba(210, 170, 90, 0.35);
    border: 4px solid #FFD54F;
  }

  h1 {
    font-size: 2.2rem;
    color: #8B5E00;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #B8860B;
    margin-bottom: 35px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  button {
    font-size: 1.3rem;
    padding: 18px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }

  .choice-btn {
    background: #FFD54F;
    color: #6B4E00;
    box-shadow: 0 6px 0 #E0A800;
  }

  .choice-btn:hover {
    transform: translateY(-3px);
  }

  .choice-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #E0A800;
  }

  .result-box {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .result-box.show {
    display: flex;
  }

  .buttons.hide {
    display: none;
  }

  .emoji {
    font-size: 5rem;
    animation: bounce 0.6s ease infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-12px) rotate(5deg); }
  }

  .message {
    font-size: 1.8rem;
    font-weight: bold;
    color: #D2691E;
    background: #FFF3CD;
    padding: 20px 25px;
    border-radius: 20px;
    border: 3px dashed #FFB300;
  }

  .retry-btn {
    background: #FFB300;
    color: #ffffff;
    box-shadow: 0 6px 0 #C87F00;
    margin-top: 10px;
    font-size: 1.1rem;
    padding: 14px 30px;
  }

  .retry-btn:hover {
    transform: translateY(-3px);
  }

  .retry-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #C87F00;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🍯 홍서현 놀리기 🍯</h1>
  <p class="subtitle">버튼을 하나 골라보세요!</p>

  <div class="buttons" id="buttons">
    <button class="choice-btn" onclick="showResult(1)">🤫 누르면 알려줌... 궁금하지?</button>
    <button class="choice-btn" onclick="showResult(2)">🤔 이건 뭘까...?</button>
    <button class="choice-btn" onclick="showResult(3)">✨ 클릭 한번 해볼래?</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="emoji" id="emoji"></div>
    <div class="message" id="message"></div>
    <button class="retry-btn" onclick="resetChoice()">🔄 다시 고르기</button>
  </div>
</div>

<script>
  const data = {
    1: { text: "홍서현 바보 ㅋㅋㅋㅋ", emoji: "😜" },
    2: { text: "우리 오늘 일찍 끝남!! 야호~", emoji: "🤪" },
    3: { text: "홍서현 메롱~ 메에에롱~", emoji: "😝" }
  };

  function showResult(num) {
    const item = data[num];
    document.getElementById("message").textContent = item.text;
    document.getElementById("emoji").textContent = item.emoji;
    document.getElementById("buttons").classList.add("hide");
    document.getElementById("resultBox").classList.add("show");
  }

  function resetChoice() {
    document.getElementById("resultBox").classList.remove("show");
    document.getElementById("buttons").classList.remove("hide");
  }
</script>

</body>
</html>
